
name: Reusable Workflow for Flask Application

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python Version'
        type: string
        required: false
        default: '3.12'

      run_tests:
        description: 'Run Tests'
        type: boolean
        required: false
        default: true

    outputs:
      test_result:
        description: 'Test execution result'
        value: ${{ jobs.build.outputs.test_result }}

jobs:
  build:
    name: Build and Test Flask App
    runs-on: ubuntu-latest

    outputs:
      test_result: ${{ steps.test_status.outputs.result }}

    defaults:
      run:
        working-directory: python_flask

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: python_flask/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Tests
        id: tests
        if: ${{ inputs.run_tests }}
        run: pytest -v

      - name: Set Test Result
        id: test_status
        if: always()
        run: |
          if [[ "${{ steps.tests.outcome }}" == "success" ]]; then
            echo "result=passed" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.tests.outcome }}" == "skipped" ]]; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi
