name: Multiple jobs

on:
  workflow_dispatch:

  job-1:
    name: Job-1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        run: |
          echo "OS Name: $(uname -s)"
          echo "Runner Hostname: $(hostname)"
          echo "Current User: $(whoami)"

  job-2:
    name: Job-2
    runs-on: windows-latest
      - name: Checkout
        uses: actions/checkout@v7
        run: |
          echo "OS Name: $(uname -s)"
          echo "Runner Hostname: $(hostname)"
          echo "Current User: $(whoami)"
  job-3:
    name: Job-3
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        run: |
          echo "OS Name: $(uname -s)"
          echo "Runner Hostname: $(hostname)"
          echo "Current User: $(whoami)"