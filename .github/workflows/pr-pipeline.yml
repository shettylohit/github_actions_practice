
name: Pull Request Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  # Job 1: Build and Test
  build_test:
    name: Build and Test
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      python_version: '3.12'
      run_tests: true

  # Job 2: Dependency Vulnerability Review
  dependency_review:
    name: Check Dependencies for Vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Check Dependencies for Vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  # Job 3: PR Summary
  pr-comment:
    name: PR Summary
    runs-on: ubuntu-latest
    needs:
      - build_test
      - dependency_review

    steps:
      - name: Print PR Summary
        run: |
          echo "PR checks passed for branch: ${{ github.head_ref }}"
