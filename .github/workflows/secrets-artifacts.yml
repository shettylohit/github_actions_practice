name: Secret Jobs 
on:
  workflow_dispatch:
jobs:
  job-1:
    name: Job-1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check Secret 
        env: 
            SECRET_MESSAGE : ${{ secrets.MY_SECRET_MESSAGE }}
        run: |
          if [[ -n "$SECRET_MESSAGE" ]]; then
            echo "True"
          else
            echo "False"
          fi
      - name: Print Secret 
        run: echo "${{ secrets.MY_SECRET_MESSAGE }}"  # If you try to print Secret it will only print ****

        

