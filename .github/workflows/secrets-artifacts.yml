        env:
            DOCKER_PASSWORD: s3cUrePaSsw0rd
            DOCKER_USERNAME: siddhart1
        run : echo "Docker usrename is $DOCKER_USERNAME and Docker paswsord is $DOCKER_PASSWORD"


