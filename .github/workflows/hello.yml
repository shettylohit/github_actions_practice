name: Hello

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

jobs:
  greet:
    name: Greet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print greeting
        run: echo "Hello from GitHub Actions!"

      - name: Print Date and Time
        run: date

      - name: Print PR branch
        run: echo "PR check running for branch: ${{ github.head_ref }}"
