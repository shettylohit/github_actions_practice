name: Python app

on:
  workflow_dispatch:

jobs:
  code-checkout:
    name: Code checkout and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Start Flask application
        run: |
          python3 app.py > flask.log 2>&1 &
          echo $! > flask.pid
          sleep 2
          cat flask.log

      - name: Wait for Flask to start
        run: |
          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:5000/health; then
              echo
              echo "Health check passed!"
              exit 0
            fi

            echo "Waiting for Flask... attempt $i"
            sleep 2
          done

          echo "Health check failed!"
          cat flask.log
          exit 1

      - name: Test home page
        run: |
          curl -fsS http://127.0.0.1:5000/ | grep "Hello, World!"

      - name: Stop Flask application
        if: always()
        run: |
          if [ -f flask.pid ]; then
            kill "$(cat flask.pid)" 2>/dev/null || true
          fi